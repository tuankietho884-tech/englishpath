<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EnglishPath AI</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#cbd5e1;--ac:#b45309;--ok:#16a34a;--bad:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090d16;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#475569;--ac:#fbbf24}}
:root[data-theme="dark"]{--bg:#090d16;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#475569;--ac:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
.hero{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;margin-bottom:14px}
.hero h1{margin:0 0 4px;font-size:28px;color:var(--ac)}
.hero p{margin:2px 0;color:var(--mut)}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 14px}
button{cursor:pointer}
button:hover,nav button.on{border-color:var(--ac)}
nav button.on{color:var(--ac);font-weight:600}
section{display:none}
section.on{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row input{flex:1;min-width:160px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:30px 20px;text-align:center;min-height:240px}
.card small{color:var(--mut);letter-spacing:2px}
.card h2{font-size:38px;margin:10px 0;color:var(--ac)}
.card h3{margin:4px 0 14px;font-weight:500}
.card p{color:var(--mut);margin:6px 0}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.q p{margin:0 0 8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opts button{text-align:left}
.opts .ok{border-color:var(--ok);background:rgba(22,163,74,.2)}
.opts .bad{border-color:var(--bad);background:rgba(220,38,38,.2)}
.sum{font-size:20px;font-weight:700;margin:14px 0;color:var(--ac)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{border-bottom:1px solid var(--bd);padding:8px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
footer{text-align:center;color:var(--mut);padding:18px 0;font-size:14px}
</style>
</head>
<body>
<main>
<div class="hero">
<h1>🌍 EnglishPath AI</h1>
<p>Học tiếng Anh từ A1 đến C2 với <span id="total"></span> từ vựng</p>
</div>
<nav id="nav">
<button data-t="vocab" class="on">📚 Từ vựng</button>
<button data-t="search">🔎 Tra từ</button>
<button data-t="practice">🎯 Luyện từ</button>
<button data-t="quiz">📝 Kiểm tra</button>
</nav>

<section id="vocab" class="on">
<select id="vl" aria-label="Cấp độ"></select>
<div class="card" id="card" style="margin-top:12px"></div>
<div class="row">
<button id="prev">⬅ Từ trước</button>
<button id="rnd">🔀 Ngẫu nhiên</button>
<button id="next">Từ tiếp theo ➡</button>
</div>
</section>

<section id="search">
<div class="row">
<input id="sq" placeholder="Gõ từ tiếng Anh hoặc nghĩa tiếng Việt" aria-label="Từ khóa">
<select id="sl" aria-label="Cấp độ"></select>
</div>
<div class="scroll"><table><thead><tr><th>Cấp độ</th><th>Từ</th><th>Nghĩa</th><th>Ví dụ</th></tr></thead><tbody id="sr"></tbody></table></div>
<p id="sn" style="color:var(--mut)"></p>
</section>

<section id="practice">
<div class="row"><select id="pl" aria-label="Cấp độ"></select><button id="pn">🔄 Tạo bài mới</button></div>
<div id="pb"></div>
</section>

<section id="quiz">
<div class="row"><select id="ql" aria-label="Cấp độ"></select></div>
<div id="qb"></div>
</section>

<footer>EnglishPath AI · Personalized English Learning</footer>
</main>

const L=Object.keys(V);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const opts=(extra)=>(extra?['<option>Tất cả</option>']:[]).concat(L.map(l=>'<option>'+l+'</option>')).join('');
['vl','pl','ql'].forEach(id=>$('#'+id).innerHTML=opts());
$('#sl').innerHTML=opts(true);
$('#total').textContent=L.reduce((n,l)=>n+V[l].length,0);

document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
});

let idx=0;
function card(){
  const w=V[$('#vl').value];idx=((idx%w.length)+w.length)%w.length;
  const [a,b,c]=w[idx];
  $('#card').innerHTML='<small>ENGLISHPATH AI · VOCABULARY</small><h2>'+esc(a)+'</h2><h3>'+esc(b)+'</h3><hr style="border:0;border-top:1px solid var(--bd)"><p><b>Example:</b></p><p><i>'+esc(c)+'</i></p><p>Card '+(idx+1)+' / '+w.length+'</p>';
}
$('#vl').onchange=()=>{idx=0;card()};
$('#next').onclick=()=>{idx++;card()};
$('#prev').onclick=()=>{idx--;card()};
$('#rnd').onclick=()=>{const n=V[$('#vl').value].length;let j;do{j=Math.floor(Math.random()*n)}while(n>1&&j===idx);idx=j;card()};
document.addEventListener('keydown',e=>{
  if($('#vocab').classList.contains('on')&&!/INPUT|SELECT/.test(document.activeElement.tagName)){
    if(e.key==='ArrowRight'){idx++;card()}else if(e.key==='ArrowLeft'){idx--;card()}
  }
});

function search(){
  const q=$('#sq').value.trim().toLowerCase(),lv=$('#sl').value,rows=[];
  if(q)L.forEach(l=>{if(lv==='Tất cả'||lv===l)V[l].forEach(([a,b,c])=>{
    if(a.toLowerCase().includes(q)||b.toLowerCase().includes(q))rows.push([l.split(' - ')[0],a,b,c])})});
  $('#sr').innerHTML=rows.slice(0,100).map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('');
  $('#sn').textContent=q?(rows.length?'Tìm thấy '+rows.length+' từ'+(rows.length>100?' (hiện 100 từ đầu)':''):'Không tìm thấy từ nào.'):'';
}
$('#sq').oninput=search;$('#sl').onchange=search;

function runQuiz(box,items){
  let score=0,done=0;box.innerHTML='';
  const sum=document.createElement('div');sum.className='sum';
  items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='q';
    d.innerHTML='<p><b>'+(i+1)+'.</b> '+esc(it.q)+'</p>';
    const row=document.createElement('div');row.className='opts';
    it.opts.forEach((o,j)=>{
      const b=document.createElement('button');b.textContent=o;
      b.onclick=()=>{
        if(d.dataset.done)return;d.dataset.done=1;done++;
        const ok=j===it.ans;if(ok)score++;
        b.classList.add(ok?'ok':'bad');
        if(!ok)row.children[it.ans].classList.add('ok');
        if(done===items.length)sum.textContent='Kết quả: '+score+'/'+items.length+' ('+Math.round(score/items.length*100)+'%)';
      };
      row.appendChild(b);
    });
    d.appendChild(row);box.appendChild(d);
  });
  box.appendChild(sum);
}
function practice(){
  const w=V[$('#pl').value];
  const items=shuffle(w).slice(0,10).map(([a,m])=>{
    const pool=shuffle(w.filter(x=>x[1]!==m)).slice(0,3).map(x=>x[1]);
    const o=shuffle(pool.concat(m));
    return{q:'“'+a+'” nghĩa là gì?',opts:o,ans:o.indexOf(m)};
  });
  runQuiz($('#pb'),items);
}
